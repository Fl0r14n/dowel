name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for publish rights

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org # still needed: it points npm at the registry
      # a release tag that disagrees with package.json either publishes a version nobody tagged or fails at the
      # very last step, after the whole build. cheapest possible check, so it goes first
      - name: release tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag $GITHUB_REF_NAME implies $tag, package.json says $pkg"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run smoke
      # trusted publishing needs npm >= 11.5.1; node 24 ships 11.x but the exact patch drifts
      - run: npm install -g npm@latest
      # no NODE_AUTH_TOKEN: the trusted publisher registered on npmjs.com exchanges the OIDC
      # token above for publish rights, and provenance comes with it. bun publish cannot do this.
      - run: npm publish --access public
